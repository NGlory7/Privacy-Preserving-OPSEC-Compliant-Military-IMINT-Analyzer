name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Hızlı testler model ağırlığı gerektirmez (EXIF temizliği, ağ engelleyici, atıf motoru).
      # Model testleri ağırlıklar yokken otomatik atlanır.
      - name: Bağımlılıklar
        run: pip install pillow numpy opencv-python-headless pytest
      - name: Testler
        run: pytest -q
